# Palette roles
# Colors come from the tracked fallback or the optional Flume theme.
set -gq @flume_text "$thm_fg"
set -gq @flume_accent "$thm_accent"
set -gq @flume_magenta "$thm_pink"
set -gq @flume_yellow "$thm_yellow"
set -gq @flume_cyan "$thm_cyan"
set -gq @flume_green "$thm_green"

# Scroll indicators
# Hide tmux's stock corner label. Split panes use their border row; single and
# zoomed panes use status-right. Both locations share the same styled position.
set -g copy-mode-position-format ''
set -g status-interval 1
set -g pane-scrollbars-style "bg=$thm_bg,fg=$thm_accent,width=1,pad=0"
set -g @flume_copy_position "#[bold]#[fg=$thm_bg]#[bg=$thm_accent] ≡ #{copy_position}/#{copy_position_limit}#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}} #[default]"

# Status bar
set -g status on
set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style bg=$thm_bg,fg=$thm_fg

# Reset the single-line layout on reload. Expand option values before rendering.
set -g status-format[0] "#[align=left range=left]#{E:status-left}#[norange]#[align=absolute-centre]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[align=right range=right]#{E:status-right}#[norange]"
# Workspace identity is context, not an action or a success state.
set -g status-left "#[bold]#[fg=$thm_pink]#[bg=$thm_bg] #{?@workspace_name,#{@workspace_name},#S} #[default] "
set -g status-right "#{?#{&&:#{==:#{pane_mode},copy-mode},#{!=:#{pane-border-status},bottom}},#{E:@flume_copy_position},}#{?window_zoomed_flag,#[bold]#[fg=$thm_bg] #[bg=$thm_yellow] 󰊓 zoom #[default],}"

# Window tabs
%hidden window_label='#{?@workspace_mode_label,#{@workspace_mode_label},#W}'
set -g window-status-separator " "
set -g window-status-current-format "#[range=window|#{window_index}]#[bold]#[fg=$thm_bg]#[bg=$thm_pink] $window_label #[norange default]"
set -g window-status-format "#[range=window|#{window_index}]#[fg=$thm_fg]#[bg=$thm_bg] $window_label #[norange default]"

# Native notices and errors share a style. Keep them neutral and centered so
# the workspace and right-hand state badges remain visible on wide terminals.
# Prefix + ~ opens tmux's message history.
set -g display-time 4000
set -g message-style "bg=$thm_bg,fg=$thm_fg,align=centre,width=60%"
set -g message-command-style "bg=$thm_bg,fg=$thm_accent,align=centre,width=60%"
set -g message-format '#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}] #{message} '

# Pane borders
# Count one x per tiled pane. Floating pickers and zoomed layouts must not
# reserve a border row for hidden peers.
%hidden tiled_split='#{>:#{n:#{P:#{?pane_floating_flag,,x}}},1}'
set -g @flume_pane_border_status "#{?#{&&:#{==:#{window_zoomed_flag},0},$tiled_split},bottom,off}"
# Inactive structure recedes. An active split uses the same accent as picker focus.
set -g pane-border-style fg=$thm_bg,bg=$thm_bg
set -g pane-active-border-style "fg=#{?#{==:#{E:@flume_pane_border_status},bottom},$thm_accent,$thm_bg},bg=$thm_bg"
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-format "#{?#{==:#{pane_mode},copy-mode},#[align=right] #{E:@flume_copy_position} ,}"

# Layout changes cover split, close, zoom and picker events. Skip unchanged
# settings so opening a picker does not trigger an unnecessary layout resize.
set -g @flume_pane_border_changed '#{&&:#{!=:#{@myran.run.window},1},#{!=:#{pane-border-status},#{E:@flume_pane_border_status}}}'
set-hook -g window-layout-changed[100] {
    if-shell -F '#{E:@flume_pane_border_changed}' {
        set-option -w -F pane-border-status '#{E:@flume_pane_border_status}'
    }
}

# Refresh existing windows on reload. Double hashes defer expansion to
# list-windows, so each window evaluates its own border state.
# Generated commands contain only window IDs and enums.
run-shell 'tmux list-windows -a -f "##{E:@flume_pane_border_changed}" \
    -F "set-option -w -t ##{window_id} pane-border-status ##{E:@flume_pane_border_status}" \
    | tmux source-file -'
