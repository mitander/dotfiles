# Shell and terminal
# Use the managed shell even when the login shell or inherited PATH differs.
set -g default-shell "$HOME/.nix-profile/bin/fish"
set -g default-command ''
set-environment -g SHELL "$HOME/.nix-profile/bin/fish"
set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/flume.yml"
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'
set -as terminal-features ',xterm-ghostty:sync'
set -as terminal-overrides ',*256col*:Tc'
set -g focus-events on
set -s escape-time 10

# Pi needs CSI-u keys. Graphics protocols pass through to the terminal.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

# Sessions and windows
set -g history-limit 20000
set -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
set -g base-index 1

# Unused stock and personal bindings
unbind-key -T prefix o
unbind-key -T root C-o
unbind-key -T prefix m
unbind-key -T prefix M
unbind-key -T prefix P
unbind-key -T prefix I
unbind-key -T prefix M-r

# Myran owns completed-run input. Plain input must reach the application.
unbind-key -T root q
unbind-key -T root Escape
unbind-key -T root Enter

# Prefix and reload
unbind-key C-b
set -g prefix C-a
bind-key , source-file ~/.tmux.conf \; display-message "Reloaded!"

# Pane navigation
# Applications can claim navigation explicitly, by workspace role, or by command.
%hidden navigation_claim='#{==:#{@workspace_navigation},application}'
%hidden navigation_role='#{==:#{@workspace_pane_role},vim}'
%hidden navigation_command='#{m/r:^(fzf|fzf-tmux|sk|nvim|vim|view)$,#{pane_current_command}}'
%hidden navigation_app="#{||:$navigation_claim,#{||:$navigation_role,$navigation_command}}"

bind-key -n C-h if-shell -F "$navigation_app" {
    send-keys C-h
} {
    if-shell -F '#{pane_at_left}' '' 'select-pane -L'
}
bind-key -n C-j if-shell -F "$navigation_app" {
    send-keys C-j
} {
    if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
}
bind-key -n C-k if-shell -F "$navigation_app" {
    send-keys C-k
} {
    if-shell -F '#{pane_at_top}' '' 'select-pane -U'
}
bind-key -n C-l if-shell -F "$navigation_app" {
    send-keys C-l
} {
    if-shell -F '#{pane_at_right}' '' 'select-pane -R'
}

bind-key -T copy-mode-vi C-h if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi C-j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi C-k if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi C-l if-shell -F '#{pane_at_right}' '' 'select-pane -R'

# Splits and layouts
bind-key s split-window -v -c '#{pane_current_path}'
bind-key v split-window -h -c '#{pane_current_path}'
bind-key S split-window -v -c '#{pane_current_path}'
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Rotate a two-pane layout between stacked and side-by-side.
bind-key C-r if-shell -F '#{m:*[[]*,#{window_layout}}' {
    select-layout even-horizontal
} {
    select-layout even-vertical
}

bind-key f resize-pane -Z

# Switch to the last pane, zooming it only when starting from an unzoomed layout.
bind-key z if-shell -F '#{window_zoomed_flag}' {
    last-pane
} {
    last-pane
    resize-pane -Z
}

# Window and session navigation
bind-key -r C-h previous-window
bind-key -r C-l next-window
bind-key C-a last-window
bind-key Tab last-window
bind-key C-o rotate-window -D
bind-key O rotate-window -U
bind-key h switch-client -p
bind-key l switch-client -n
bind-key Space if-shell -F '#{!=:#{client_last_session},}' {
    switch-client -l
} {
    switch-client -n
}

# Search and copy mode
set -g mode-keys vi
# tmux 3.7c loops on style redraws in hidden copy-mode panes with line numbers.
# Myran's metadata updates trigger it. Keep numbers off until upstream fixes it.
set -g copy-mode-line-numbers off
set -g pane-scrollbars auto-hide
bind-key C-f copy-mode \; command-prompt -p '(search up)' 'send -X search-backward "%%%"'

set -g set-clipboard external
set -g @yank_action 'copy-pipe'
set -g @yank_selection_mouse 'clipboard'
set -g @shell_mode 'vi'
unbind-key p
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-p send-keys -X page-up
bind-key -T copy-mode-vi C-n send-keys -X page-down
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Theme and status bar
# Set styling before TPM. Continuum appends its autosave hook to status-right.
# Resetting that option after plugins would silently disable autosave.
source-file ~/dotfiles/extras/tmux/colors.conf
source-file -q ~/dotfiles/tmux/.tmux/flume-theme.conf
source-file ~/dotfiles/tmux/.tmux/workspace-status.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "$XDG_DATA_HOME/tmux/resurrect"
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
run-shell '~/.tmux/plugins/tpm/tpm'
unbind-key I

# Workspace integration
# Myran owns workspace, role and run shortcuts. Configure personal keys there.
# Install a binary with the tmux integration command before reloading.
run-shell 'myran tmux configure --replace'

# Keep the browser in this Session, not a popup that can restore focus over the editor.
bind-key y new-window -n files -c '#{@workspace_root}' 'myran-yazi'

# Pane closing
# Apply after integration setup. Ctrl-Q closes one Neovim window. Prefix q
# quits all editor windows. Both confirm before abandoning unsaved changes.
# Run closure uses Myran's public cleanup command, scoped to the focused pane.
%hidden close_run='TMUX=#{q:socket_path},#{pid},#{s/^.//:session_id} TMUX_PANE=#{q:pane_id} myran close-run'
bind-key -n C-q if-shell -F '#{==:#{@workspace_pane_role},vim}' {
    send-keys C-q
} {
    if-shell -F '#{==:#{@workspace_pane_role},run}' {
        run-shell -b "$close_run"
    } {
        kill-pane
    }
}
bind-key q if-shell -F '#{==:#{@workspace_pane_role},vim}' {
    send-keys Escape ':confirm qall' Enter
} {
    if-shell -F '#{==:#{@workspace_pane_role},run}' {
        run-shell -b "$close_run"
    } {
        kill-pane
    }
}
