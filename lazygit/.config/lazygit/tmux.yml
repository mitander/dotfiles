# Loaded by Myran inside tmux.
# LazyGit shell-quotes {{filename}}. Do not add another quoting layer.
os:
  edit: myr open -- {{filename}}
  editAtLine: myr open -- {{filename}}
  editAtLineAndWait: myr open -- {{filename}}
  editInTerminal: false
keybinding:
  universal:
    quit: Q
    quit-alt1: <disabled>
    quitWithoutChangingDirectory: <disabled>
customCommands:
  - key: q
    context: global
    description: Hide lazygit tmux window
    command: tmux select-window -l
