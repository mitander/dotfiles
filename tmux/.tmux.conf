# settings
# Keep status redraws cheap when many sessions/panes are alive. Nothing in the
# status bar needs 1s updates.
set -g status-interval 5
set-option -g default-command fish
set-option -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:sync'
set -ga terminal-overrides ',*256col*:Tc'
set-option -g focus-events on
set-option -sg escape-time 10
set-option -g history-limit 5000
set-option -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
set -g base-index 1

# Stable command paths come from Home Manager. Repository fallbacks keep a
# freshly cloned configuration usable before activation.
if-shell 'test -x "$HOME/.local/bin/tmux-project"' \
    'set -g @workspace_project_script "$HOME/.local/bin/tmux-project"' \
    'set -g @workspace_project_script "$HOME/dotfiles/scripts/tmux-project.sh"'
if-shell 'test -x "$HOME/.local/bin/tmux-session"' \
    'set -g @workspace_session_script "$HOME/.local/bin/tmux-session"' \
    'set -g @workspace_session_script "$HOME/dotfiles/scripts/tmux-session.sh"'

# Workspace Residency cools only restartable Git and task panes after a detached
# grace period. Neovim, agent, run, shell, and unclassified panes keep running.
# Home Manager installs the stable command; the repository path is the fallback.
set -g @workspace_residency_mode cool
set -g @workspace_residency_grace_seconds 900
if-shell 'test -x "$HOME/.local/bin/tmux-residency"' \
    'set -g @workspace_residency_script "$HOME/.local/bin/tmux-residency"' \
    'set -g @workspace_residency_script "$HOME/dotfiles/scripts/tmux-residency.sh"'
set-hook -g client-attached[80] 'run-shell -b "\"#{@workspace_residency_script}\" request-reconcile"'
set-hook -g client-detached[80] 'run-shell -b "\"#{@workspace_residency_script}\" request-reconcile"'
set-hook -g client-session-changed[80] 'run-shell -b "\"#{@workspace_residency_script}\" request-reconcile"'
set-hook -g session-created[80] 'run-shell -b "\"#{@workspace_residency_script}\" request-reconcile"'
run-shell -b '"#{@workspace_residency_script}" reconcile'

# reload config (prefix + +)
unbind M-r
unbind F5
unbind +
bind + source-file ~/.tmux.conf \; display "Reloaded!"

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# vim keys
setw -g mode-keys vi
# Navigation ownership is metadata, updated when an application starts or exits.
# Keypresses stay entirely inside tmux's format engine and never fork ps/grep.
is_nav_app='#{||:#{==:#{@workspace_navigation},application},#{||:#{==:#{@workspace_pane_role},vim},#{m/r:^(fzf|fzf-tmux|hx|helix|sk|nvim|vim|view)$,#{pane_current_command}}}}'
is_vim='#{||:#{==:#{@workspace_pane_role},vim},#{m/r:^(nvim|vim|view)$,#{pane_current_command}}}'
bind-key -n 'C-h' if-shell -F "$is_nav_app" 'send-keys C-h' 'if-shell -F "#{pane_at_left}" "" "select-pane -L"'
bind-key -n 'C-j' if-shell -F "$is_nav_app" 'send-keys C-j' 'if-shell -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n 'C-k' if-shell -F "$is_nav_app" 'send-keys C-k' 'if-shell -F "#{pane_at_top}" "" "select-pane -U"'
bind-key -n 'C-l' if-shell -F "$is_nav_app" 'send-keys C-l' 'if-shell -F "#{pane_at_right}" "" "select-pane -R"'
bind-key -n 'C-q' if-shell -F "$is_vim" 'send-keys C-w q' \
    'if-shell -F "#{==:#{@workspace_pane_role},run}" \
        "run-shell -b \"\\\"#{@workspace_project_script}\\\" close-run \\\"#{pane_id}\\\"\"" "kill-pane"'
bind-key -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if-shell -F '#{pane_at_right}' '' 'select-pane -R'

# Run windows keep completed output until Enter/q/Escape dismisses it.
bind-key -n q if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'run-shell -b "\"#{@workspace_project_script}\" close-run \"#{pane_id}\""' \
    'send-keys q'
bind-key -n Escape if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'run-shell -b "\"#{@workspace_project_script}\" close-run \"#{pane_id}\""' \
    'send-keys Escape'
bind-key -n Enter if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'if-shell -F "#{==:#{@myran.run.state},completed}" \
        "run-shell -b \"\\\"#{@workspace_project_script}\\\" close-run \\\"#{pane_id}\\\"\"" ""' \
    'send-keys Enter'
bind-key -n C-p if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'copy-mode -u' \
    'send-keys C-p'
bind-key -n C-n if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'copy-mode \; send-keys -X page-down' \
    'send-keys C-n'

# search in pane
bind C-f copy-mode \; command-prompt -p "(search up)" "send -X search-backward \"%%%\""

# tmux-yank
set -g set-clipboard external
set -g @yank_action 'copy-pipe-and-cancel'
set -g @yank_selection_mouse 'clipboard'
set -g @shell_mode 'vi'

# copy-mode
# Prefix-p opens the Actions watcher. Paste remains available from copy mode.
unbind p
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-p send-keys -X page-up
bind-key -T copy-mode-vi C-n send-keys -X page-down
bind-key -T copy-mode-vi Enter if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'if-shell -F "#{==:#{@myran.run.state},completed}" \
        "run-shell -b \"\\\"#{@workspace_project_script}\\\" close-run \\\"#{pane_id}\\\"\"" ""' \
    'send-keys -X copy-selection-and-cancel'
bind-key -T copy-mode-vi q if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'run-shell -b "\"#{@workspace_project_script}\" close-run \"#{pane_id}\""' \
    'send-keys -X cancel'
bind-key -T copy-mode-vi Escape if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'run-shell -b "\"#{@workspace_project_script}\" close-run \"#{pane_id}\""' \
    'send-keys -X cancel'

# workspace modes: prefix + <mode> switches to that mode, creating it if needed.
bind-key e run-shell -b '"#{@workspace_project_script}" vim #{q:pane_current_path}'
bind-key a run-shell -b 'cd #{q:pane_current_path} && myr role open agent'
bind-key A command-prompt -p "AI task name:" "run-shell -b '\"#{@workspace_project_script}\" ai-new #{q:pane_current_path} \"%%%\"'"
bind-key g run-shell -b '"#{@workspace_project_script}" git #{q:pane_current_path}'
bind-key t run-shell -b '"#{@workspace_project_script}" tasks #{q:pane_current_path}'
bind-key c run-shell -b '"#{@workspace_project_script}" shell #{q:pane_current_path}'
unbind m
unbind M
bind-key -T prefix Enter run-shell -b 'cd #{q:pane_current_path} && myr run >/dev/null 2>&1 || tmux display-message "Myran run failed"'
bind-key -T prefix C-Enter run-shell -b 'cd #{q:pane_current_path} && myr pick-run >/dev/null 2>&1 || tmux display-message "Myran picker failed"'
bind-key r select-window -t :run
bind-key s split-window -v -c "#{pane_current_path}"

# splits
bind-key v split-window -h -c "#{pane_current_path}"
bind-key S split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# rotate two-pane layout between stacked and side-by-side
bind-key C-r if -F '#{m:*[[]*,#{window_layout}}' 'select-layout even-horizontal' 'select-layout even-vertical'

bind-key -r C-h previous-window
bind-key -r C-l next-window
bind-key C-a last-window
bind-key Tab last-window
bind-key q if-shell -F '#{==:#{@workspace_pane_role},run}' \
    'run-shell -b "\"#{@workspace_project_script}\" close-run \"#{pane_id}\""' \
    'kill-window'
bind-key C-o rotate-window -D
bind-key O rotate-window -U

bind-key h switch-client -p
bind-key l switch-client -n
bind-key Space switch-client -l
bind-key w run-shell -b '"#{@workspace_session_script}" switch'
unbind P
bind-key I run-shell -b '"#{@workspace_residency_script}" sleep "#{session_id}"'

bind-key f resize-pane -Z
bind-key z run-shell "tmux setenv zoomed $(tmux display -p '#{window_zoomed_flag}')"\; \
         last-pane\; \
         run-shell "test $(tmux display -p '#{zoomed}') -ne 0 || tmux resize-pane -Z"


# Set status styling before TPM. Continuum appends its autosave hook to
# status-right, so resetting that option after plugins would silently disable it.
# Start with tracked colors, then use the optional Flume-generated theme.
source-file ~/dotfiles/extras/tmux/colors.conf
source-file -q ~/dotfiles/tmux/.tmux/flume-theme.conf
source-file ~/dotfiles/tmux/.tmux/workspace-status.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# tmux-cpu is intentionally not loaded: the current status bar does not use its
# segments, and avoiding unused status interpolation keeps redraws cheaper.
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "$XDG_DATA_HOME/tmux/resurrect"
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'

# Watch active GitHub Actions checks for the current repository. This lives
# after TPM because tmux-fzf also claims prefix + P.
bind-key p run-shell -b '"#{@workspace_project_script}" actions #{q:pane_current_path}'

# pi support
set -g extended-keys on
set -g extended-keys-format csi-u

# allow terminal graphics protocols (e.g. Kitty image protocol) to pass through tmux
set -g allow-passthrough on
