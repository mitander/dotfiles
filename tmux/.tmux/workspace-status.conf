# Palette roles
# Colors come from the tracked fallback or the optional Flume theme.
set -gq @flume_text "$thm_fg"
set -gq @flume_accent "$thm_accent"
set -gq @flume_magenta "$thm_pink"
set -gq @flume_yellow "$thm_yellow"
set -gq @flume_cyan "$thm_cyan"
set -gq @flume_green "$thm_green"

# Status bar
set -g status on
set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style bg=$thm_bg,fg=$thm_fg

# Reset the single-line layout on reload. Expand option values before rendering.
set -g status-format[0] "#[align=left range=left]#{E:status-left}#[norange]#[align=absolute-centre]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[align=right range=right]#{E:status-right}#[norange]"
set -g status-left "#[bold]#[fg=$thm_bg]#[bg=$thm_accent] #{?@workspace_name,#{@workspace_name},#S} #[default] "
set -g status-right "#{?window_zoomed_flag,#[bold]#[fg=$thm_bg]#[bg=$thm_yellow] 󰊓 zoom #[default],}"

# Window tabs
%hidden window_label='#{?@workspace_mode_label,#{@workspace_mode_label},#W}'
%hidden window_color="#{?@workspace_mode_color,#{@workspace_mode_color},$thm_pink}"
set -g window-status-separator " "
set -g window-status-current-format "#[range=window|#{window_index}]#[bold]#[fg=$thm_bg]#[bg=$window_color] $window_label #[norange default]"
set -g window-status-format "#[range=window|#{window_index}]#[fg=$thm_lgray]#[bg=$thm_bg] $window_label #[norange default]"

# Pane borders
# Only visible tiled splits need a focus row. Count one x per non-floating pane;
# zoomed panes and floating pickers must not reserve space for hidden peers.
set -g @flume_pane_border_status '#{?#{&&:#{==:#{window_zoomed_flag},0},#{>:#{n:#{P:#{?pane_floating_flag,,x}}},1}},bottom,off}'
# Keep pane structure quiet; the workspace and active tab carry the accents.
set -g pane-border-style fg=$thm_bg,bg=$thm_bg
set -g pane-active-border-style "fg=#{?#{==:#{E:@flume_pane_border_status},bottom},$thm_lgray,$thm_bg},bg=$thm_bg"
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-format ""

# Layout changes cover split, close, zoom and picker events. Skip unchanged
# settings so opening a picker does not trigger an unnecessary layout resize.
set -g @flume_pane_border_changed '#{&&:#{!=:#{@myran.run.window},1},#{!=:#{pane-border-status},#{E:@flume_pane_border_status}}}'
set-hook -g window-layout-changed[100] {
    if-shell -F '#{E:@flume_pane_border_changed}' {
        set-option -w -F pane-border-status '#{E:@flume_pane_border_status}'
    }
}

# Refresh existing windows on reload. Double hashes defer expansion to
# list-windows, so each window evaluates its own border state.
# Generated commands contain only window IDs and enums.
run-shell 'tmux list-windows -a -f "##{E:@flume_pane_border_changed}" \
    -F "set-option -w -t ##{window_id} pane-border-status ##{E:@flume_pane_border_status}" \
    | tmux source-file -'
